<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scoreboard</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

.scorebar{
  position:absolute;
  top:20px;
  left:20px;
  display:flex;
  align-items:center;
  background:#000;
  color:#fff;
  padding:10px 18px;
  border-radius:6px;
  font-size:30px;
  font-weight:bold;
  gap:18px;
}

.team{
  min-width:150px;
}

.score{
  font-size:38px;
}

.time{
  font-size:30px;
  min-width:90px;
  text-align:center;
}
</style>
</head>

<body>

<div class="scorebar">
  <div id="home" class="team">ECHIPA 1</div>
  <div id="hs" class="score">0</div>

  <div id="time" class="time">00:00</div>

  <div id="as" class="score">0</div>
  <div id="away" class="team">ECHIPA 2</div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket=io();

socket.on('state',s=>{

  document.getElementById('home').textContent=s.home.name;
  document.getElementById('away').textContent=s.away.name;

  document.getElementById('hs').textContent=s.home.score;
  document.getElementById('as').textContent=s.away.score;

  let sec=s.elapsed||0;
  let min=Math.floor(sec/60);
  let rem=sec%60;

  document.getElementById('time').textContent=
    String(min).padStart(2,'0')+':' +
    String(rem).padStart(2,'0');
});
</script>

</body>
</html>
