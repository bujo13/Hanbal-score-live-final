<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control tabelă</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#fff;text-align:center;margin:0;padding:20px}
input{font-size:20px;padding:10px;margin:6px;width:90%;box-sizing:border-box}
button{font-size:22px;padding:14px 20px;margin:6px;border:0;border-radius:8px}
.score{font-size:48px;margin:12px}
.time{font-size:32px;margin:12px}
</style>
</head>
<body>

<h1>Control tabelă</h1>

<input id="home" value="ECHIPA 1">
<button onclick="homePlus()">+1 GAZDE</button>

<input id="away" value="ECHIPA 2">
<button onclick="awayPlus()">+1 OASPEȚI</button>

<div class="score">
<span id="hs">0</span> - <span id="as">0</span>
</div>

<div class="time" id="time">00:00</div>

<button onclick="startTimer()">START</button>
<button onclick="stopTimer()">STOP</button>
<button onclick="resetGame()">RESET</button>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

let state = {
  home:{name:'ECHIPA 1',score:0},
  away:{name:'ECHIPA 2',score:0},
  elapsed:0,
  running:false
};

function patch(data){
  socket.emit('patch',data);
}

function homePlus(){
  state.home.score++;
  patch({home:{score:state.home.score}});
}

function awayPlus(){
  state.away.score++;
  patch({away:{score:state.away.score}});
}

function startTimer(){
  patch({running:true});
}

function stopTimer(){
  patch({running:false});
}

function resetGame(){
  socket.emit('reset');
}

document.getElementById('home').addEventListener('change',function(){
  patch({home:{name:this.value}});
});

document.getElementById('away').addEventListener('change',function(){
  patch({away:{name:this.value}});
});

socket.on('state',function(s){
  state=s;

  document.getElementById('home').value=s.home.name;
  document.getElementById('away').value=s.away.name;

  document.getElementById('hs').textContent=s.home.score;
  document.getElementById('as').textContent=s.away.score;

  let sec=s.elapsed||0;
  let min=Math.floor(sec/60);
  let rem=sec%60;

  document.getElementById('time').textContent=
    String(min).padStart(2,'0')+':' +
    String(rem).padStart(2,'0');
});
</script>

</body>
</html>
